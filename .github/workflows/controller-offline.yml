name: DDF controller offline tests
on:
  pull_request:
    paths:
      - 'controller/**'
      - '.github/workflows/controller-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: controller-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout untrusted PR source with no persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Offline safety tests
        run: npm test
        working-directory: controller
      - name: Offline simulated end-to-end
        run: npm run demo
        working-directory: controller
