name: docs-check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Check documentation consistency
        run: node scripts/docs-check.mjs
