# Example <operator-config>/routing.yaml (schema ddf.routing/v1, spec section 7.2)
# All model names below are EXAMPLES only; choose your own per provider.
# `provider` names the model provider the entry calls; DDF compares only this field
# (reviewers.r2DifferentProvider) and never derives it from `model`.
tiers:
  deep:     [{adapter: claude-code, provider: anthropic, model: opus-5.5, effort: high}]      # example model
  standard: [{adapter: claude-code, provider: anthropic, model: opus-5.5, effort: medium},    # example model
             {adapter: opencode, provider: example-provider-b, model: "<provider/model>"}]         # fallback on rate limit
  routine:  [{adapter: claude-code, provider: anthropic, model: sonnet-5.5, effort: medium}]  # example model
  fast:     [{adapter: claude-code, provider: anthropic, model: haiku-5.5, effort: low}]      # example model
roles:
  r2: {prefer: [{adapter: opencode, provider: example-provider-c, model: "<other-provider/model>"}]}   # optional
limits:
  maxConcurrentContainers: 2     # every container counts: Executor, each reviewer, local gate, forge-local CI
  maxSubagentsPerRun: 3          # advisory, passed to the agent; not enforceable by the CLIs
