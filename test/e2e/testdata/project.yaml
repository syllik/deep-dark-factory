# The connected project's .ddf/project.yaml for the end-to-end tests
# (placeholder values). AUTONOMY is replaced by each test.
version: ddf.project/v1
integrationBranch: main
autonomy: AUTONOMY
verify: [make verify]
checks:
  required: [verify]
planning:
  maxAutoChildren: 2
change:
  branch: "{type}/issue-{n}-{slug}"
